<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6e6eff"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8888a0"/>
    </marker>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16162a"/>
      <stop offset="100%" stop-color="#12121e"/>
    </linearGradient>
    <linearGradient id="server-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a34"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#0a0a0f"/>

  <!-- Zone labels -->
  <text x="28" y="90" fill="#8888a0" font-size="11" font-weight="600" letter-spacing="2" text-anchor="middle" transform="rotate(-90, 28, 90)">VENUE</text>
  <text x="28" y="270" fill="#8888a0" font-size="11" font-weight="600" letter-spacing="2" text-anchor="middle" transform="rotate(-90, 28, 270)">INTERNET</text>
  <text x="28" y="470" fill="#8888a0" font-size="11" font-weight="600" letter-spacing="2" text-anchor="middle" transform="rotate(-90, 28, 470)">PERFORMERS</text>

  <!-- Zone dividers -->
  <line x1="56" y1="150" x2="880" y2="150" stroke="#1e1e2e" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="56" y1="350" x2="880" y2="350" stroke="#1e1e2e" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== VENUE ZONE ===== -->

  <!-- Speakers -->
  <!-- Speaker 1 -->
  <g transform="translate(310, 28)">
    <rect x="0" y="0" width="36" height="48" rx="4" fill="#16162a" stroke="#e0e0e8" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="8" fill="none" stroke="#e0e0e8" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="3" fill="#e0e0e8" opacity="0.5"/>
    <circle cx="18" cy="36" r="5" fill="none" stroke="#e0e0e8" stroke-width="1.5"/>
    <circle cx="18" cy="36" r="2" fill="#e0e0e8" opacity="0.5"/>
  </g>
  <!-- Speaker 2 -->
  <g transform="translate(400, 28)">
    <rect x="0" y="0" width="36" height="48" rx="4" fill="#16162a" stroke="#e0e0e8" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="8" fill="none" stroke="#e0e0e8" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="3" fill="#e0e0e8" opacity="0.5"/>
    <circle cx="18" cy="36" r="5" fill="none" stroke="#e0e0e8" stroke-width="1.5"/>
    <circle cx="18" cy="36" r="2" fill="#e0e0e8" opacity="0.5"/>
  </g>
  <!-- Speaker 3 -->
  <g transform="translate(490, 28)">
    <rect x="0" y="0" width="36" height="48" rx="4" fill="#16162a" stroke="#e0e0e8" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="8" fill="none" stroke="#e0e0e8" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="3" fill="#e0e0e8" opacity="0.5"/>
    <circle cx="18" cy="36" r="5" fill="none" stroke="#e0e0e8" stroke-width="1.5"/>
    <circle cx="18" cy="36" r="2" fill="#e0e0e8" opacity="0.5"/>
  </g>
  <text x="400" y="92" fill="#8888a0" font-size="12" text-anchor="middle">Audio</text>

  <!-- Laptop / Audio Software -->
  <g transform="translate(350, 105)">
    <!-- Screen -->
    <rect x="0" y="0" width="100" height="55" rx="4" fill="url(#card-bg)" stroke="#2a2a3e" stroke-width="1"/>
    <rect x="6" y="6" width="88" height="38" rx="2" fill="#0d0d14"/>
    <!-- Code lines in screen -->
    <rect x="12" y="13" width="40" height="3" rx="1" fill="#6e6eff" opacity="0.6"/>
    <rect x="12" y="21" width="55" height="3" rx="1" fill="#50fa7b" opacity="0.4"/>
    <rect x="12" y="29" width="30" height="3" rx="1" fill="#8be9fd" opacity="0.4"/>
    <rect x="12" y="37" width="48" height="3" rx="1" fill="#ffb86c" opacity="0.4"/>
    <!-- Base -->
    <path d="M -8 55 L 108 55 L 116 62 L -16 62 Z" fill="#1a1a26" stroke="#2a2a3e" stroke-width="1"/>
  </g>
  <text x="400" y="190" fill="#b0b0c0" font-size="12" text-anchor="middle">Csound, Max, Pd, SC, etc.</text>

  <!-- Arrow: laptop to speakers -->
  <line x1="400" y1="105" x2="400" y2="80" stroke="#6e6eff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== INTERNET ZONE ===== -->

  <!-- Server -->
  <g transform="translate(370, 220)">
    <rect x="0" y="0" width="100" height="70" rx="6" fill="url(#server-bg)" stroke="#6e6eff" stroke-width="1.5" opacity="0.9"/>
    <!-- Server rack lines -->
    <rect x="10" y="12" width="80" height="8" rx="2" fill="#0d0d14"/>
    <circle cx="18" cy="16" r="2" fill="#50fa7b"/>
    <circle cx="26" cy="16" r="2" fill="#50fa7b"/>
    <rect x="10" y="28" width="80" height="8" rx="2" fill="#0d0d14"/>
    <circle cx="18" cy="32" r="2" fill="#50fa7b"/>
    <circle cx="26" cy="32" r="2" fill="#ffb86c"/>
    <rect x="10" y="44" width="80" height="8" rx="2" fill="#0d0d14"/>
    <circle cx="18" cy="48" r="2" fill="#50fa7b"/>
    <circle cx="26" cy="48" r="2" fill="#50fa7b"/>
  </g>
  <text x="420" y="310" fill="#b0b0c0" font-size="12" text-anchor="middle">Remote OSC Server</text>

  <!-- Arrow: server to laptop -->
  <line x1="420" y1="220" x2="420" y2="168" stroke="#6e6eff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="198" fill="#8888a0" font-size="10">Data</text>

  <!-- ===== PERFORMERS ZONE ===== -->

  <!-- Client 1: Local computer / Raspberry Pi -->
  <g transform="translate(100, 380)">
    <rect x="0" y="0" width="110" height="56" rx="6" fill="url(#card-bg)" stroke="#2a2a3e" stroke-width="1"/>
    <!-- File icon -->
    <path d="M 20 14 L 20 38 L 40 38 L 48 30 L 48 14 Z" fill="none" stroke="#8be9fd" stroke-width="1.5"/>
    <path d="M 40 14 L 40 30 L 48 30" fill="none" stroke="#8be9fd" stroke-width="1.5"/>
    <text x="56" y="22" fill="#b0b0c0" font-size="10">Remote OSC</text>
    <text x="56" y="34" fill="#b0b0c0" font-size="10">Client</text>
  </g>
  <text x="155" y="455" fill="#8888a0" font-size="10" text-anchor="middle">Local computer</text>
  <text x="155" y="467" fill="#8888a0" font-size="10" text-anchor="middle">Raspberry Pi, etc.</text>

  <!-- Client 2 -->
  <g transform="translate(310, 380)">
    <rect x="0" y="0" width="110" height="56" rx="6" fill="url(#card-bg)" stroke="#2a2a3e" stroke-width="1"/>
    <path d="M 20 14 L 20 38 L 40 38 L 48 30 L 48 14 Z" fill="none" stroke="#8be9fd" stroke-width="1.5"/>
    <path d="M 40 14 L 40 30 L 48 30" fill="none" stroke="#8be9fd" stroke-width="1.5"/>
    <text x="56" y="22" fill="#b0b0c0" font-size="10">Remote OSC</text>
    <text x="56" y="34" fill="#b0b0c0" font-size="10">Client</text>
  </g>

  <!-- Client 3 -->
  <g transform="translate(520, 380)">
    <rect x="0" y="0" width="110" height="56" rx="6" fill="url(#card-bg)" stroke="#2a2a3e" stroke-width="1"/>
    <path d="M 20 14 L 20 38 L 40 38 L 48 30 L 48 14 Z" fill="none" stroke="#8be9fd" stroke-width="1.5"/>
    <path d="M 40 14 L 40 30 L 48 30" fill="none" stroke="#8be9fd" stroke-width="1.5"/>
    <text x="56" y="22" fill="#b0b0c0" font-size="10">Remote OSC</text>
    <text x="56" y="34" fill="#b0b0c0" font-size="10">Client</text>
  </g>

  <!-- Client 4: Web Interface -->
  <g transform="translate(720, 380)">
    <rect x="0" y="0" width="110" height="56" rx="6" fill="url(#card-bg)" stroke="#2a2a3e" stroke-width="1"/>
    <!-- Browser icon -->
    <rect x="16" y="14" width="32" height="24" rx="3" fill="none" stroke="#8be9fd" stroke-width="1.5"/>
    <line x1="16" y1="22" x2="48" y2="22" stroke="#8be9fd" stroke-width="1"/>
    <circle cx="22" cy="18" r="1.5" fill="#8be9fd"/>
    <circle cx="28" cy="18" r="1.5" fill="#8be9fd"/>
    <text x="56" y="22" fill="#b0b0c0" font-size="10">Web</text>
    <text x="56" y="34" fill="#b0b0c0" font-size="10">Interface</text>
  </g>

  <!-- Arrows: clients to server -->
  <line x1="155" y1="380" x2="395" y2="290" stroke="#6e6eff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="365" y1="380" x2="410" y2="290" stroke="#6e6eff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="575" y1="380" x2="445" y2="290" stroke="#6e6eff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="775" y1="380" x2="775" y2="290" stroke="#6e6eff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="775" y1="290" x2="470" y2="255" stroke="#6e6eff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="260" y="330" fill="#8888a0" font-size="10">Data</text>
  <text x="560" y="330" fill="#8888a0" font-size="10">Data</text>
  <text x="790" y="330" fill="#8888a0" font-size="10">Data</text>

  <!-- ===== INTERFACES ===== -->

  <!-- Interface row label -->
  <text x="155" y="520" fill="#6e6eff" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1">Interfaces</text>
  <text x="365" y="520" fill="#6e6eff" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1">Interfaces</text>
  <text x="575" y="520" fill="#6e6eff" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1">Interfaces</text>
  <text x="775" y="520" fill="#6e6eff" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1">Interfaces</text>

  <!-- Sensor + Arduino -->
  <g transform="translate(120, 535)">
    <!-- Sensor waveform -->
    <path d="M 0 12 L 8 12 L 12 4 L 18 20 L 24 8 L 30 16 L 36 12 L 44 12" fill="none" stroke="#ff79c6" stroke-width="1.5"/>
    <text x="22" y="32" fill="#8888a0" font-size="10" text-anchor="middle">Sensor</text>
  </g>
  <g transform="translate(155, 500)">
    <!-- Arduino icon -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ffb86c" stroke-width="1.5"/>
    <text x="24" y="4" fill="#8888a0" font-size="10">Arduino</text>
  </g>
  <!-- Arrow: interfaces to client 1 -->
  <line x1="155" y1="535" x2="155" y2="436" stroke="#8888a0" stroke-width="1" marker-end="url(#arrow-muted)"/>
  <line x1="155" y1="500" x2="155" y2="436" stroke="#8888a0" stroke-width="1" marker-end="url(#arrow-muted)"/>
  <text x="175" y="480" fill="#8888a0" font-size="9">Data</text>

  <!-- Live Coding -->
  <g transform="translate(340, 535)">
    <!-- Terminal icon -->
    <rect x="0" y="0" width="44" height="28" rx="4" fill="none" stroke="#50fa7b" stroke-width="1.5"/>
    <text x="8" y="18" fill="#50fa7b" font-size="12" font-family="monospace">&gt;_</text>
    <text x="22" y="42" fill="#8888a0" font-size="10" text-anchor="middle">Live Coding</text>
  </g>
  <!-- Arrow: interface to client 2 -->
  <line x1="365" y1="535" x2="365" y2="436" stroke="#8888a0" stroke-width="1" marker-end="url(#arrow-muted)"/>
  <text x="385" y="480" fill="#8888a0" font-size="9">Data</text>

  <!-- Custom OSC Device -->
  <g transform="translate(540, 535)">
    <!-- Device icon -->
    <rect x="0" y="0" width="44" height="28" rx="4" fill="none" stroke="#8be9fd" stroke-width="1.5"/>
    <text x="8" y="18" fill="#8be9fd" font-size="10" font-family="monospace">&lt;/&gt;</text>
    <text x="22" y="42" fill="#8888a0" font-size="10" text-anchor="middle">Custom OSC</text>
    <text x="22" y="54" fill="#8888a0" font-size="10" text-anchor="middle">Device</text>
  </g>
  <!-- Arrow: interface to client 3 -->
  <line x1="575" y1="535" x2="575" y2="436" stroke="#8888a0" stroke-width="1" marker-end="url(#arrow-muted)"/>
  <text x="595" y="480" fill="#8888a0" font-size="9">Data</text>

  <!-- Legend -->
  <g transform="translate(680, 570)">
    <text x="0" y="0" fill="#8888a0" font-size="10" font-weight="600">Legend</text>
    <line x1="0" y1="14" x2="30" y2="14" stroke="#6e6eff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="38" y="18" fill="#8888a0" font-size="9">OSC data flow</text>
    <line x1="0" y1="32" x2="30" y2="32" stroke="#8888a0" stroke-width="1" marker-end="url(#arrow-muted)"/>
    <text x="38" y="36" fill="#8888a0" font-size="9">Local input</text>
  </g>

</svg>
